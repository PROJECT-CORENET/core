name: deploy

# Развёртывание сети нод на своих серверах (self-hosted раннеры с метками proxy / nl / vn / imirjar).
#
# Компиляция — только на бесплатных раннерах GitHub (workflow `node`, ubuntu-latest → образ в GHCR).
# Серверы ничего не собирают: скачивают готовый образ и перезапускают контейнер.
#
# Запускается сам после успешного workflow `node` на main (образ уже в GHCR)
# или вручную: Actions → deploy → Run workflow (можно указать тег образа).
#
# Ключи каждой ноды создаются при первом запуске и живут в docker-томе `core-node-data` на сервере —
# адрес ноды не меняется между развёртываниями. Bootstrap собирается сам: каждая нода знает адреса всех остальных.

on:
  workflow_run:
    workflows: [node]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег образа ghcr.io/<owner>/core-node (latest, sha-xxxxxxx, 0.1.0 …)
        default: latest
        required: true

# Развёртывания идут строго по очереди и не прерывают друг друга на полпути.
concurrency:
  group: deploy-network
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  # Владелец может быть с заглавными (PROJECT-CORENET), а Docker принимает только нижний регистр —
  # итоговый IMAGE (в нижнем регистре) выставляет шаг «Image tag».
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/core-node
  # Тег: ручной запуск — из формы, автоматический — образ ровно того коммита, что прошёл `node`.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('sha-{0}', github.event.workflow_run.head_sha) }}
  CONTAINER: core-node
  VOLUME: core-node-data
  # Порт внутри контейнера (см. Dockerfile); снаружи — порт из списка нод.
  INNER_PORT: "7443"

jobs:
  # 1. Поднять образ и получить адрес каждой ноды (ключи создаются в томе при первом запуске).
  identity:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: &nodes
          - { runner: proxy, name: N1, region: RU, host: "188.225.72.79:7445" }
          - { runner: nl, name: N2, region: NL, host: "141.98.235.172:7445" }
          - { runner: vn, name: N3, region: RU, host: "213.171.4.253:7445" }
    #        - { runner: imirjar, name: I1, region: RU, host: "91.215.121.220:7445" }
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    name: identity ${{ matrix.name }}
    steps:
      - name: Image tag
        id: tag
        # sha-<полный> → sha-<7 символов>, как его называет docker/metadata-action.
        run: |
          tag="$TAG"
          case "$tag" in sha-*) tag="sha-$(echo "${tag#sha-}" | cut -c1-7)";; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "🏷️ image $(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]'):$tag"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: docker pull "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Node address
        run: |
          docker volume create "$VOLUME" >/dev/null
          docker run --rm -v "$VOLUME:/data" -e CORE_PUBLIC_HOST="${{ matrix.host }}" \
            "$IMAGE:${{ steps.tag.outputs.tag }}" info | tee info.txt
          addr=$(sed -n 's/^address: //p' info.txt)
          [ -n "$addr" ] || { echo "❌ no address in core-node info"; exit 1; }
          mkdir -p out
          echo "$addr" > "out/${{ matrix.name }}.addr"
          echo "${{ matrix.region }}" > "out/${{ matrix.name }}.region"
          echo "🆔 ${{ matrix.name }} → $addr"

      - uses: actions/upload-artifact@v4
        with:
          name: addr-${{ matrix.name }}
          path: |
            out/${{ matrix.name }}.addr
            out/${{ matrix.name }}.region
          retention-days: 7

  # APNs credentials are available only to the dedicated gateway job.
  push:
    needs: identity
    if: vars.CORE_PUSH_PORT != ''
    runs-on: [self-hosted, proxy]
    environment: push-apns
    outputs:
      gateway: ${{ steps.gateway.outputs.address }}
    steps:
      - name: Image tag
        id: tag
        run: |
          tag="$TAG"
          case "$tag" in sha-*) tag="sha-$(echo "${tag#sha-}" | cut -c1-7)";; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Start APNs gateway
        id: gateway
        env:
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          CORE_PUSH_PORT: ${{ vars.CORE_PUSH_PORT }}
          CORE_PUSH_GATEWAY: ${{ vars.CORE_PUSH_GATEWAY }}
          CORE_PUBLIC_MAILBOX: 188.225.72.79:7445
        run: |
          set -euo pipefail
          : "${APNS_KEY_P8:?Set APNS_KEY_P8}" "${APNS_KEY_ID:?Set APNS_KEY_ID}" "${APNS_TEAM_ID:?Set APNS_TEAM_ID}"
          [[ "$CORE_PUSH_PORT" =~ ^[0-9]+$ ]] && ((CORE_PUSH_PORT > 0 && CORE_PUSH_PORT < 65536))
          image="$IMAGE:${{ steps.tag.outputs.tag }}"
          public="${CORE_PUBLIC_MAILBOX%:*}:$CORE_PUSH_PORT"
          docker volume create core-push-data >/dev/null
          address=$(docker run --rm -v core-push-data:/data -e CORE_PUBLIC_HOST="$public" "$image" info | sed -n 's/^address: //p')
          [ -n "$address" ] || { echo "Could not discover the push gateway address"; exit 1; }
          if [ -n "$CORE_PUSH_GATEWAY" ] && [ "$address" != "$CORE_PUSH_GATEWAY" ]; then
            echo "Configured CORE_PUSH_GATEWAY does not match $address"
            exit 1
          fi
          printf '%s\n' "$APNS_KEY_P8" | docker run --rm -i --user root --entrypoint /bin/sh -v core-push-data:/data "$image" -ec '
            umask 077
            cat > /data/.apns-key.new
            chown 10001 /data/.apns-key.new
            mv -f /data/.apns-key.new /data/apns-key.p8
          '
          docker rm -f core-push >/dev/null 2>&1 || true
          docker run -d --name core-push --restart unless-stopped \
            -p "$CORE_PUSH_PORT:$INNER_PORT" -v core-push-data:/data \
            -e CORE_PUBLIC_HOST="$public" -e CORE_NAME=CORE-Push \
            -e CORE_PUSH_DB=/data/push.db -e APNS_KEY_FILE=/data/apns-key.p8 -e APNS_KEY_ID -e APNS_TEAM_ID \
            "$image" run
          for attempt in $(seq 1 15); do
            if docker exec core-push core-healthcheck; then
              echo "address=$address" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 30 core-push
          exit 1

  # 2. Запустить ноды: bootstrap — все остальные ноды сети.
  run:
    needs: [identity, push]
    if: ${{ !cancelled() && needs.identity.result == 'success' && (needs.push.result == 'success' || needs.push.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include: *nodes
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    name: run ${{ matrix.name }}
    steps:
      - name: Image tag
        id: tag
        run: |
          tag="$TAG"
          case "$tag" in sha-*) tag="sha-$(echo "${tag#sha-}" | cut -c1-7)";; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: addr-*
          path: addrs
          merge-multiple: true

      - name: Bootstrap list
        id: boot
        run: |
          own=$(cat "addrs/${{ matrix.name }}.addr")
          boot=$(cat addrs/*.addr | grep -vxF "$own" | paste -sd, -)
          echo "list=$boot" >> "$GITHUB_OUTPUT"
          echo "🔗 ${{ matrix.name }} bootstrap: $boot"

      - name: Start node
        env:
          CORE_PUSH_GATEWAY: ${{ needs.push.outputs.gateway || vars.CORE_PUSH_GATEWAY }}
        run: |
          port="${{ matrix.host }}"; port="${port##*:}"
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER" \
            --restart unless-stopped \
            --ulimit nofile=65536:65536 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            -p "$port:$INNER_PORT" \
            -v "$VOLUME:/data" \
            -e RUST_LOG=info \
            -e CORE_PUSH_GATEWAY \
            -e CORE_PUBLIC_HOST="${{ matrix.host }}" \
            -e CORE_NAME="${{ matrix.name }}" \
            -e CORE_REGION="${{ matrix.region }}" \
            -e CORE_BOOTSTRAP="${{ steps.boot.outputs.list }}" \
            -e GIT_NODES="${{ vars.GIT_NODES }}" \
            "$IMAGE:${{ steps.tag.outputs.tag }}" run
          echo "🚀 ${{ matrix.name }} started on :$port"

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER")
            [ "$status" = healthy ] && { echo "✅ ${{ matrix.name }} healthy"; exit 0; }
            [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" = true ] || break
            sleep 3
          done
          echo "❌ ${{ matrix.name }} is not healthy (status: $status)"
          docker logs --tail 200 "$CONTAINER"
          exit 1

      - name: Clean old images
        if: always()
        run: docker image prune -f --filter "until=168h" >/dev/null || true

  # 3. Проверка снаружи: каждая нода отвечает по публичному адресу; готовый nodes.json для приложения.
  verify:
    needs: [run, push]
    if: ${{ !cancelled() && needs.run.result == 'success' }}
    runs-on: [self-hosted, proxy]
    steps:
      - name: Image tag
        id: tag
        run: |
          tag="$TAG"
          case "$tag" in sha-*) tag="sha-$(echo "${tag#sha-}" | cut -c1-7)";; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: addr-*
          path: addrs
          merge-multiple: true

      - name: Ping every node by public address
        run: |
          failed=0
          {
            echo "### Сеть CORE"
            echo
            echo "| Нода | Адрес | Пинг |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in addrs/*.addr; do
            name=$(basename "$f" .addr); addr=$(cat "$f")
            if out=$(docker run --rm --entrypoint core-cli "$IMAGE:${{ steps.tag.outputs.tag }}" ping --count 3 "$addr" 2>&1); then
              echo "✅ $name: $out"
              result="✅"
              touch "addrs/$name.online"
            else
              echo "❌ $name unreachable: $out"
              result="❌ недоступна"
              failed=1
            fi
            echo "| $name | \`$addr\` | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $failed

      - name: nodes.json
        if: always()
        env:
          CORE_PUSH_GATEWAY: ${{ needs.push.outputs.gateway || vars.CORE_PUSH_GATEWAY }}
        run: |
          mkdir -p out
          {
            echo "["
            first=1
            for f in addrs/*.addr; do
              [ $first = 1 ] || echo ","
              first=0
              name=$(basename "$f" .addr)
              region=$(cat "addrs/$name.region" 2>/dev/null || true)
              online=false; [ -f "addrs/$name.online" ] && online=true
              printf '  {"name": "%s", "region": "%s", "address": "%s", "online": %s}' "$name" "$region" "$(cat "$f")" "$online"
            done
            echo
            echo "]"
          } > out/nodes.json
          # Keep gateway metadata separate so older clients cannot select it as a mailbox.
          printf '%s\n' '[]' > out/push.json
          if [ -n "$CORE_PUSH_GATEWAY" ]; then
            online=false
            if docker run --rm --entrypoint core-cli "$IMAGE:${{ steps.tag.outputs.tag }}" ping --count 1 "$CORE_PUSH_GATEWAY" >/dev/null 2>&1; then
              online=true
            fi
            python3 - "$CORE_PUSH_GATEWAY" "$online" <<'PYTHON'
          import json
          import pathlib
          import sys

          path = pathlib.Path("out/push.json")
          nodes = [{"name": "CORE-Push", "region": "RU", "address": sys.argv[1],
                    "online": sys.argv[2] == "true", "role": "push"}]
          path.write_text(json.dumps(nodes, indent=2) + "\n")
          PYTHON
          fi
          cat out/nodes.json
          {
            echo
            echo "Список для приложения и нод с \`GIT_NODES\` (публикуется на GitHub Pages):"
            echo '```json'
            cat out/nodes.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodes-json
          path: |
            out/nodes.json
            out/push.json

  # 4. Страница со списком нод на GitHub Pages + nodes.json рядом: из него приложение выбирает
  #    ближайшую ноду, а ноды с GIT_NODES=1 — соседей. Один раз: Settings → Pages → Source: GitHub Actions.
  pages:
    needs: verify
    if: always() && needs.verify.result != 'skipped' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: nodes-json
          path: site

      - name: Build page
        run: |
          python3 scripts/nodes-page.py site/nodes.json site/index.html "${{ github.sha }}"
          touch site/.nojekyll
          echo "📄 $(grep -c '"address"' site/nodes.json) nodes on the page"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
